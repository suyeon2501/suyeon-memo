<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수연 메모장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2383e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수연 메모장">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #ffffff;
    --side: #f7f6f3;
    --hover: #ebeae6;
    --active: #e3e2de;
    --text: #37352f;
    --muted: #9b9a97;
    --border: #e9e9e7;
    --accent: #2383e2;
    --danger: #eb5757;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --side: #202020;
      --hover: #2b2b2b;
      --active: #343434;
      --text: #e6e6e4;
      --muted: #7f7f7c;
      --border: #2f2f2f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: flex; height: 100%; }

  /* sidebar */
  .sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--side);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .side-head { padding: 14px 14px 8px; display: flex; align-items: center; gap: 8px; }
  .side-head h1 { font-size: 15px; margin: 0; flex: 1; font-weight: 600; }
  .btn {
    border: 0; background: transparent; border-radius: 6px;
    padding: 6px 10px; font-size: 14px;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .search { padding: 0 14px 10px; }
  .search input {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: inherit; font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .list { flex: 1; overflow-y: auto; padding: 0 8px 12px; min-height: 0; }
  .item {
    display: block; width: 100%; text-align: left;
    border: 0; background: transparent; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 2px;
  }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); }
  .item .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item mark { background: #ffe58a; color: #000; border-radius: 2px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }

  /* editor */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: none; align-items: center; gap: 6px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .topbar .spacer { flex: 1; }
  .editor { flex: 1; overflow-y: auto; padding: 48px 56px 60px; min-height: 0; }
  .editor-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100%; }
  .title {
    width: 100%; border: 0; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 36px; font-weight: 700; padding: 0; margin-bottom: 8px;
  }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; display: flex; gap: 12px; align-items: center; }
  .meta .grow { flex: 1; }
  .body {
    width: 100%; flex: 1; min-height: 50vh; border: 0; outline: none; resize: none;
    background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.7; padding: 0;
  }
  .title::placeholder, .body::placeholder { color: var(--muted); opacity: .6; }
  .placeholder {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted);
  }

  /* mobile */
  @media (max-width: 720px) {
    .sidebar { width: 100%; border-right: 0; }
    .main { display: none; width: 100%; }
    .app.editing .sidebar { display: none; }
    .app.editing .main { display: flex; }
    .topbar { display: flex; padding-top: max(8px, env(safe-area-inset-top)); }
    .side-head { padding-top: max(14px, env(safe-area-inset-top)); }
    .editor { padding: 20px 18px 40px; }
    .title { font-size: 28px; }
    .search input, .title, .body { font-size: 16px; } /* iOS 확대 방지 */
    .item { padding: 12px 10px; }
    .placeholder { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <h1>📝 수연 메모장</h1>
      <button class="btn primary" id="newBtn" title="새 메모">＋ 새 메모</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="검색" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>

  <section class="main">
    <div class="topbar">
      <button class="btn" id="backBtn">← 목록</button>
      <span class="spacer"></span>
      <button class="btn danger" id="delBtn2">삭제</button>
    </div>
    <div class="editor" id="editor"></div>
  </section>
</div>

<script>
(() => {
  const KEY = 'memo-app-v1';
  const $ = id => document.getElementById(id);
  const app = $('app'), listEl = $('list'), editorEl = $('editor'), qEl = $('q');

  let notes = [];
  let currentId = null;
  let query = '';

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && Array.isArray(raw.notes)) { notes = raw.notes; currentId = raw.currentId; }
    } catch (e) {}
    if (!notes.length) {
      const n = makeNote('환영합니다 👋', '왼쪽 목록에서 메모를 고르거나 "＋ 새 메모"로 새로 만드세요.\n\n- 입력하면 자동 저장됩니다.\n- 새로고침해도 메모는 남아 있어요.\n- 위 검색창으로 제목·본문을 찾을 수 있어요.');
      notes.push(n); currentId = n.id; save();
    }
    if (!notes.some(n => n.id === currentId)) currentId = notes[0].id;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ notes, currentId })); }
    catch (e) { alert('저장 공간이 부족하거나 저장할 수 없습니다.'); }
  }
  function makeNote(title = '', body = '') {
    const now = Date.now();
    return { id: now.toString(36) + Math.random().toString(36).slice(2, 6), title, body, created: now, updated: now };
  }
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function hl(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(re, m => '<mark>' + m + '</mark>');
  }
  function fmt(ts) {
    const d = new Date(ts), now = new Date();
    const same = d.toDateString() === now.toDateString();
    return same
      ? d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function snippet(n, q) {
    const body = n.body.replace(/\s+/g, ' ').trim();
    if (!q) return body || '내용 없음';
    const i = body.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return body || '내용 없음';
    const start = Math.max(0, i - 15);
    return (start ? '…' : '') + body.slice(start, start + 80);
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    const arr = [...notes].sort((a, b) => b.updated - a.updated);
    return q ? arr.filter(n => (n.title + '\n' + n.body).toLowerCase().includes(q)) : arr;
  }

  function renderList() {
    const q = query.trim();
    const arr = filtered();
    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">' + (q ? '검색 결과가 없습니다.' : '메모가 없습니다.') + '</div>';
      return;
    }
    listEl.innerHTML = arr.map(n => `
      <button class="item ${n.id === currentId ? 'active' : ''}" data-id="${n.id}">
        <div class="t">${hl(n.title || '제목 없음', q)}</div>
        <div class="s">${fmt(n.updated)} · ${hl(snippet(n, q), q)}</div>
      </button>`).join('');
  }

  function renderEditor() {
    const n = notes.find(x => x.id === currentId);
    if (!n) {
      editorEl.innerHTML = '<div class="placeholder"><div>메모를 선택하거나 새로 만드세요</div></div>';
      return;
    }
    editorEl.innerHTML = `
      <div class="editor-inner">
        <input class="title" id="title" placeholder="제목 없음" value="${esc(n.title)}">
        <div class="meta">
          <span id="metaTxt">수정 ${fmt(n.updated)}</span><span class="grow"></span>
          <button class="btn danger" id="delBtn">삭제</button>
        </div>
        <textarea class="body" id="body" placeholder="내용을 입력하세요…">${esc(n.body)}</textarea>
      </div>`;
    $('title').addEventListener('input', onEdit);
    $('body').addEventListener('input', onEdit);
    $('delBtn').addEventListener('click', removeCurrent);
  }

  function onEdit() {
    const n = notes.find(x => x.id === currentId);
    if (!n) return;
    n.title = $('title').value;
    n.body = $('body').value;
    n.updated = Date.now();
    save();
    $('metaTxt').textContent = '수정 ' + fmt(n.updated);
    renderList();
  }

  function select(id) {
    currentId = id; save();
    app.classList.add('editing');
    renderList(); renderEditor();
  }

  function addNote() {
    const n = makeNote();
    notes.push(n);
    query = ''; qEl.value = '';
    select(n.id);
    const t = $('title'); if (t) t.focus();
  }

  function removeCurrent() {
    const n = notes.find(x => x.id === currentId);
    if (!n) return;
    if (!confirm(`"${n.title || '제목 없음'}" 메모를 삭제할까요?`)) return;
    const sorted = filtered();
    const idx = sorted.findIndex(x => x.id === n.id);
    notes = notes.filter(x => x.id !== n.id);
    const rest = filtered();
    currentId = rest.length ? rest[Math.min(idx, rest.length - 1)].id : (notes[0] && notes[0].id) || null;
    save();
    app.classList.remove('editing');
    renderList(); renderEditor();
  }

  listEl.addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (b) select(b.dataset.id);
  });
  $('newBtn').addEventListener('click', addNote);
  $('backBtn').addEventListener('click', () => { app.classList.remove('editing'); });
  $('delBtn2').addEventListener('click', removeCurrent);
  qEl.addEventListener('input', () => { query = qEl.value; renderList(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); qEl.focus(); }
  });
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); renderList(); renderEditor(); } });

  load();
  renderList();
  renderEditor();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
